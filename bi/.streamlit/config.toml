[theme]
# Configuration Streamlit Theme
primaryColor = "#0066cc"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f2f6"
textColor = "#262730"
font = "sans serif"

[client]
# Streamlit Client Config
showErrorDetails = true
logger.level = "info"

[logger]
level = "info"

[server]
port = 8501
headless = true
runOnSave = false
maxUploadSize = 200
